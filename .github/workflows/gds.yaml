name: gds

on:
  push:
  workflow_dispatch:

jobs:
  gds:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build GDS
        uses: TinyTapeout/tt-gds-action@ttihp27a
        with:
          pdk: ihp-sg13cmos5l # or ihp-sg13g2

  timing:
    # print the worst setup paths so they can be read from the job log
    needs: gds
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: GDS_logs
          path: logs
      - name: Worst setup paths per corner
        run: |
          find logs -path "*sta*" -name "*.rpt" | sort | head -50
          for f in $(find logs -path "*stapostpnr*" \( -name "max*.rpt" -o -name "*max*.rpt" \) | sort); do
            echo "=================== $f"
            head -c 12000 "$f"
          done
          for f in $(find logs -path "*stapostpnr*" -name "summary.rpt" | sort); do echo "=== $f"; cat "$f"; done
      - name: Routing DRC report
        run: |
          find logs -iname "*drc*" | sort
          for f in $(find logs -path "*detailedrouting*" \( -iname "*.drc" -o -iname "*drc*.rpt" \) | sort); do
            echo "=================== $f"
            head -c 20000 "$f"
          done

  precheck:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: Run Tiny Tapeout Precheck
        uses: TinyTapeout/tt-gds-action/precheck@ttihp27a

  gl_test:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: GL test
        uses: TinyTapeout/tt-gds-action/gl_test@ttihp27a

  viewer:
    needs: gds
    runs-on: ubuntu-24.04
    permissions:
      pages: write # to deploy to Pages
      id-token: write # to verify the deployment originates from an appropriate source
    steps:
      - uses: TinyTapeout/tt-gds-action/viewer@ttihp27a
